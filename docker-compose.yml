services:
  postgres:
    image: postgres:16-alpine
    container_name: kai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kai
    ports:
      - "5433:5432"
    volumes:
      - kai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kai_postgres_data:
